name: Update Pi Top 300

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch the official Pi catalog
        run: python scripts/update_catalog.py

      - name: Validate the snapshot
        run: python scripts/validate_catalog.py

      - name: Generate the full README catalog
        run: python scripts/generate_docs.py

      - name: Create an update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/update-pi-top300
          delete-branch: true
          title: "chore: update Pi top 300 snapshot"
          commit-message: "chore: update Pi top 300 snapshot"
          body: |
            Automated snapshot refresh from the official Pi package catalog.

            Please review ranking changes, package descriptions, and editorial classifications before merging.
          labels: automated-update
